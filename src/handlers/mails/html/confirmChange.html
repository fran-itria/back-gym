<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario solicita cambio de gimnasio</title>
    <style>
        div {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #333;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin: 0;
            padding: 0;
        }
        p {
            margin: 0;
            padding: 0;
        }
        a {
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding-left: 3px;
            padding-right: 3px;
            font-size: 1em;
            font-weight: 500;
            font-family: inherit;
            background-color: #d1d5db;
            color: #1f2937;
            border: solid 2px black;
            cursor: pointer;
            transition: ease-in-out 500ms;
            text-decoration: none;
        }
        footer {
            font-size: 15px;
            color: #474747;
        }
    </style>
</head>
<body>
    <div>
        <h1>
            Hola <b>{gym}</b>.
        </h1>
        <p>
            <b>{name} {surname}</b> quiere incorporarse a su gimnasio
        </p>
        <p>
            ¿Desea aceptar la solicitud? 
        </p>
        <a href='https://pro-active-center.vercel.app/acceptUser?userId={user.id}&gymId={gym.id}'>
            Aceptar
        </a>
        <br>
        <footer>
            Saludos cordiales,
            El equipo de {team}
        </footer>
    </div>
</body>
</html>
